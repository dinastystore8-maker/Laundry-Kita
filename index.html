<style>
:root{
  --navy:#0B0E1A; --navy-2:#141A2E;
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-alt:#FBF8F1; --topbar-bg:rgba(246,243,236,.86);
  --ink:#1B1710; --muted:#7A7263; --line:#E7DFCC;
  --accent:#A9782E; --accent-d:#7E5A20; --accent-l:#F3E8D2;
  --amber:#C17A2E; --amber-l:#FBF0DC;
  --green:#3F7D5B; --green-l:#E7F2EA;
  --red:#B33A3A; --red-l:#FBEAE7;
  --r-sm:11px; --r-md:16px; --r-lg:22px;
  --shadow:0 1px 2px rgba(30,22,8,.05), 0 20px 44px -22px rgba(30,22,8,.28);
  --gold-line:linear-gradient(90deg, transparent, rgba(169,120,46,.55), transparent);
}
[data-theme="dark"]{
  --bg:#0A0A0E; --surface:#15141A; --surface-alt:#1B1A22; --topbar-bg:rgba(10,10,14,.86);
  --ink:#EFE9DC; --muted:#9C9486; --line:#2C2A2E;
  --accent:#C9A24A; --accent-d:#E0B85E; --accent-l:#2B2413;
  --amber-l:#332711; --green-l:#132A1F; --red-l:#301616;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 20px 44px -22px rgba(0,0,0,.6);
}

/* ============ FONT PAIRINGS (independent of UI style/shape) ============ */
:root, [data-font="classic"]{ --font-heading:'Fraunces'; --font-body:'Inter'; }
[data-font="poppins"]{ --font-heading:'Poppins'; --font-body:'Poppins'; }
[data-font="jakarta"]{ --font-heading:'Plus Jakarta Sans'; --font-body:'Plus Jakarta Sans'; }
[data-font="spacegrotesk"]{ --font-heading:'Space Grotesk'; --font-body:'Inter'; }
[data-font="dmserif"]{ --font-heading:'DM Serif Display'; --font-body:'DM Sans'; }

/* ============ UI STYLE PRESETS (5 distinct looks, independent of light/dark, accent color & font) ============ */
/* --style-radius-1/2/3 = small/medium/large radius scale; --style-shadow = card/table/modal shadow;
   --style-border-w = border thickness for cards/buttons; applied broadly below. */
:root, [data-style="classic"]{
  --style-radius-1:9px; --style-radius-2:12px; --style-radius-3:20px;
  --style-shadow:var(--shadow); --style-border-w:1px; --style-btn-radius:10px; --style-pill-radius:100px;
}
[data-style="minimal"]{
  --style-radius-1:4px; --style-radius-2:6px; --style-radius-3:8px;
  --style-shadow:none; --style-border-w:1px; --style-btn-radius:6px; --style-pill-radius:6px;
}
[data-style="soft"]{
  --style-radius-1:14px; --style-radius-2:20px; --style-radius-3:28px;
  --style-shadow:0 10px 30px -12px rgba(30,22,8,.18); --style-border-w:1px; --style-btn-radius:100px; --style-pill-radius:100px;
}
[data-style="bold"]{
  --style-radius-1:6px; --style-radius-2:8px; --style-radius-3:10px;
  --style-shadow:4px 4px 0 0 var(--ink); --style-border-w:2px; --style-btn-radius:7px; --style-pill-radius:7px;
}
[data-style="playful"]{
  --style-radius-1:16px; --style-radius-2:22px; --style-radius-3:30px;
  --style-shadow:0 12px 0 -4px rgba(0,0,0,.06), 0 16px 34px -14px rgba(30,22,8,.28); --style-border-w:1.5px; --style-btn-radius:100px; --style-pill-radius:100px;
}
[data-style="glass"]{
  --style-radius-1:12px; --style-radius-2:18px; --style-radius-3:22px;
  --style-shadow:0 20px 50px -20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); --style-border-w:1px; --style-btn-radius:12px; --style-pill-radius:100px;
}
[data-style="corporate"]{
  --style-radius-1:6px; --style-radius-2:8px; --style-radius-3:10px;
  --style-shadow:0 1px 3px rgba(15,23,42,.08); --style-border-w:1px; --style-btn-radius:8px; --style-pill-radius:8px;
}
[data-style] .card{ border-radius:var(--style-radius-3); box-shadow:var(--style-shadow); border-width:var(--style-border-w); }
[data-style] .table-wrap{ border-radius:var(--style-radius-3); box-shadow:var(--style-shadow); border-width:var(--style-border-w); }
[data-style] .modal{ border-radius:var(--style-radius-3); }
[data-style] .btn{ border-radius:var(--style-btn-radius); border-width:var(--style-border-w); }
[data-style] .chip{ border-radius:var(--style-radius-1); border-width:var(--style-border-w); }
[data-style] .badge{ border-radius:var(--style-pill-radius); }
[data-style] .pill{ border-radius:var(--style-pill-radius); }
[data-style] .field input, [data-style] .field select, [data-style] .field textarea, [data-style] .search-input input{ border-radius:var(--style-radius-1); border-width:var(--style-border-w); }
[data-style] .icon-btn, [data-style] .x-close, [data-style] .hamburger{ border-radius:var(--style-radius-1); border-width:var(--style-border-w); }
[data-style] .fab-main{ border-radius:var(--style-radius-1); }
[data-style="soft"] .fab-main, [data-style="playful"] .fab-main, [data-style="classic"] .fab-main{ border-radius:50%; }
[data-style] .fab-option{ border-radius:var(--style-pill-radius); border-width:var(--style-border-w); }
[data-style="bold"] .card, [data-style="bold"] .table-wrap{ border-color:var(--ink); }
[data-style="bold"] .btn-primary{ box-shadow:3px 3px 0 0 var(--ink); }
[data-style="playful"] .stat .icon-badge{ border-radius:var(--style-radius-2); }

/* Glass (Dashboard Analitik) — glassmorphism cards, glowing accent stat numbers, best paired with dark mode */
[data-style="glass"] .card{ background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01)), var(--surface); backdrop-filter:blur(10px); border-color:rgba(255,255,255,.08); }
[data-style="glass"] .stat .value{ text-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); }
[data-style="glass"] .topbar{ backdrop-filter:blur(14px); }
[data-style="glass"] .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-d)); box-shadow:0 8px 22px -8px color-mix(in srgb, var(--accent) 65%, transparent); }
[data-style="glass"] .sidebar{ background:linear-gradient(180deg, var(--navy), #05060c); }

/* Corporate (Korporat Bersih) — flat, structured, professional blue-gray */
[data-style="corporate"] .card{ box-shadow:none; }
[data-style="corporate"] .table-wrap{ box-shadow:none; }
[data-style="corporate"] .btn-primary{ box-shadow:none; font-weight:600; }
[data-style="corporate"] .stat .value{ font-weight:700; }
[data-style="corporate"] h1,[data-style="corporate"] h2,[data-style="corporate"] h3{ letter-spacing:-.4px; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{touch-action:manipulation;}
svg{width:16px;height:16px;vertical-align:-3px;flex-shrink:0;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body,'Inter'),sans-serif;overscroll-behavior-y:none;transition:background .2s,color .2s;}
h1,h2,h3,.disp{font-family:var(--font-heading,'Fraunces'),serif;font-optical-sizing:auto;letter-spacing:-.2px;}
.mono{font-family:'JetBrains Mono',monospace;}
.eyebrow{font-family:var(--font-heading,'Fraunces'),serif;font-style:italic;font-weight:500;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-l);}
a{color:inherit;}

#app{display:none;min-height:100vh;}
#app.ready{display:flex;}
.sidebar{width:230px;background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:1px 0 0 rgba(201,162,74,.08);}
.brand{padding:24px 20px 18px;border-bottom:1px solid rgba(201,162,74,.16);position:relative;}
.brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.2px;background:linear-gradient(120deg,#F1D999,#C9A24A 55%,#A9782E);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .addr{font-size:11.5px;color:#9B9584;margin-top:5px;line-height:1.4;}
.nav{padding:16px 10px;flex:1;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#B7B0A0;font-size:14px;font-weight:500;margin-bottom:2px;transition:.15s;border:none;background:none;width:100%;text-align:left;position:relative;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(201,162,74,.08);color:#fff;}
.nav-item.active{background:rgba(201,162,74,.13);color:#F1D999;}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,#F1D999,#A9782E);}
.nav-foot{padding:16px 14px;border-top:1px solid rgba(201,162,74,.16);font-size:12px;color:#948C7A;}
.nav-foot b{color:#F1D999;font-weight:600;}

.main{flex:1;min-width:0;}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(10px);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.topbar h1{font-size:21px;margin:0;font-weight:600;font-family:'Fraunces',serif;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.pill{font-size:12px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:100px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.off{background:#C7D0DE;}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.icon-btn svg{width:17px;height:17px;}
.view{padding:22px 26px 90px;}

.hamburger{display:none;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink);transition:.15s;}
.btn svg{width:15px;height:15px;flex-shrink:0;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#C9A24A,#8F6425);border-color:#8F6425;color:#1B1710;box-shadow:0 6px 16px -6px rgba(143,100,37,.5);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-navy{background:linear-gradient(135deg,var(--navy-2),var(--navy));border-color:var(--navy);color:#F1D999;}
.btn-danger{background:var(--red-l);border-color:#e3b8ae;color:var(--red);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;pointer-events:none;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);}
.stat{padding:20px 18px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold-line);}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.stat .value{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin-top:7px;font-variant-numeric:oldstyle-nums;}
.stat .delta{font-size:12px;margin-top:6px;color:var(--muted);}
.stat .icon-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;flex-wrap:wrap;gap:8px;}
.section-head:first-child{margin-top:0;}
.section-head h3{font-size:15px;margin:0;font-weight:700;}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:13px 14px;background:var(--surface-alt);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-alt);}
.empty-row td{text-align:center;color:var(--muted);padding:34px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.b-teal{background:var(--accent-l);color:var(--accent-d);border:1px solid rgba(169,120,46,.25);}
.b-amber{background:var(--amber-l);color:#B45309;}
.b-green{background:var(--green-l);color:#15803D;}
.b-red{background:var(--red-l);color:var(--red);}
.b-gray{background:var(--surface-alt);color:var(--muted);border:1px solid var(--line);}

.overlay{position:fixed;inset:0;background:rgba(10,16,30,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .18s ease;display:flex;flex-direction:column;max-height:85vh;}
.modal.wide{max-width:760px;}
@keyframes pop{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:0;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.x-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--muted);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
.field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--surface-alt);color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field textarea{resize:vertical;min-height:70px;}
.chip-select{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 14px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface);}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip .sub{display:block;font-size:10.5px;font-weight:500;opacity:.75;margin-top:1px;}

.gate{position:fixed;inset:0;z-index:300;overflow-y:auto;min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1100px 600px at 15% -10%, #1E2748 0%, transparent 60%),
  radial-gradient(900px 500px at 110% 10%, #6B4E1E 0%, transparent 55%), var(--navy);
  padding:24px;}
.gate-card{width:100%;max-width:420px;background:rgba(255,255,255,.98);border-radius:24px;padding:32px 30px;box-shadow:0 40px 90px rgba(0,0,0,.45);color:#1B1710;border-top:2px solid transparent;border-image:var(--gold-line) 1;}
.gate-logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#C9A24A,#8F6425);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 20px -6px rgba(143,100,37,.6);}
.gate-card h2{margin:0 0 4px;font-size:22px;font-family:'Fraunces',serif;font-weight:600;}
.gate-card p.desc{font-size:13px;color:#7A7263;margin:0 0 22px;font-style:italic;}
.emp-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;max-height:220px;overflow-y:auto;}
.emp-btn{padding:12px;border-radius:12px;border:1.5px solid #E7DFCC;background:#fff;text-align:left;}
.emp-btn.sel{border-color:var(--accent);background:var(--accent-l);}
.emp-btn .en{font-weight:700;font-size:13.5px;}
.scanner-overlay{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3F7D5B;vertical-align:middle;margin-left:2px;}
.scanner-overlay video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.scanner-topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 16px calc(16px + env(safe-area-inset-top));color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);}
.scanner-topbar button{background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;}
.scanner-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(72vw,300px);height:min(72vw,300px);z-index:1;}
.scanner-frame::before,.scanner-frame::after{content:'';position:absolute;width:36px;height:36px;border-color:#F3E8D2;border-style:solid;}
.scanner-frame::before{top:0;left:0;border-width:4px 0 0 4px;border-top-left-radius:14px;}
.scanner-frame::after{bottom:0;right:0;border-width:0 4px 4px 0;border-bottom-right-radius:14px;}
.scanner-frame .corner2{position:absolute;top:0;right:0;width:36px;height:36px;border:4px solid #F3E8D2;border-width:4px 4px 0 0;border-top-right-radius:14px;}
.scanner-frame .corner3{position:absolute;bottom:0;left:0;width:36px;height:36px;border:4px solid #F3E8D2;border-width:0 0 4px 4px;border-bottom-left-radius:14px;}
.scanner-frame .scan-line{position:absolute;left:4%;right:4%;height:2px;background:linear-gradient(90deg,transparent,#F3E8D2,transparent);animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%{top:6%}50%{top:94%}100%{top:6%}}
.scanner-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:13px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.scanner-bottombar{position:absolute;bottom:calc(90px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:2;}

/* ================= UNDO / REDO =================
   Snapshot-based: before any meaningful data-changing action (delete, save,
   status change, payment change, etc.) we snapshot all collections. Undo
   restores the previous snapshot (and pushes current state to the redo
   stack); Redo does the reverse. Restoring goes through DB.set() as usual,
   so cloud sync (if Firebase is active) stays consistent automatically. */
let undoStack = [], redoStack = [];
const UNDO_LIMIT = 25;
function snapshotState(){
  return {
    orders:JSON.parse(JSON.stringify(orders)), customers:JSON.parse(JSON.stringify(customers)),
    kas:JSON.parse(JSON.stringify(kas)), invTx:JSON.parse(JSON.stringify(invTx)),
    repairs:JSON.parse(JSON.stringify(repairs)), kosList:JSON.parse(JSON.stringify(kosList)),
    inventory:JSON.parse(JSON.stringify(inventory)), services:JSON.parse(JSON.stringify(services)),
    kasirLog:JSON.parse(JSON.stringify(kasirLog)), pickupRequests:JSON.parse(JSON.stringify(pickupRequests)),
    settings:JSON.parse(JSON.stringify(SETTINGS)),
  };
}
function snapshot(){
  undoStack.push(snapshotState());
  if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoUI();
}
function applySnapshot(s){
  orders=s.orders; customers=s.customers; kas=s.kas; invTx=s.invTx; repairs=s.repairs;
  kosList=s.kosList; inventory=s.inventory; services=s.services; kasirLog=s.kasirLog;
  pickupRequests=s.pickupRequests; SETTINGS=s.settings;
  DB.set('orders',orders); DB.set('customers',customers); DB.set('kas',kas); DB.set('invTx',invTx);
  DB.set('repairs',repairs); DB.set('kosList',kosList); DB.set('inventory',inventory);
  DB.set('services',services); DB.set('kasirLog',kasirLog); DB.set('pickupRequests',pickupRequests);
  DB.set('settings',SETTINGS);
}
function performUndo(){
  if(!undoStack.length){ toast('Tidak ada yang bisa di-undo','ℹ️'); return; }
  redoStack.push(snapshotState());
  applySnapshot(undoStack.pop());
  closeModal(); VIEW_RENDERERS[currentView]();
  toast('↩️ Undo berhasil');
  updateUndoRedoUI();
}
function performRedo(){
  if(!redoStack.length){ toast('Tidak ada yang bisa di-redo','ℹ️'); return; }
  undoStack.push(snapshotState());
  applySnapshot(redoStack.pop());
  closeModal(); VIEW_RENDERERS[currentView]();
  toast('↪️ Redo berhasil');
  updateUndoRedoUI();
}
function updateUndoRedoUI(){
  const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');
  if(u){ u.disabled = !undoStack.length; u.innerHTML = ICONS.undo; }
  if(r){ r.disabled = !redoStack.length; r.innerHTML = ICONS.redo; }
}

function b64urlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme.mode);
  document.documentElement.setAttribute('data-style', theme.style||'classic');
  document.documentElement.setAttribute('data-font', theme.font||'classic');
  document.documentElement.style.setProperty('--accent', theme.accent.base);
  document.documentElement.style.setProperty('--accent-d', theme.accent.dark);
  document.documentElement.style.setProperty('--accent-l', theme.accent.light);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.innerHTML = theme.mode==='dark' ? ICONS.sun : ICONS.moon;
}
function toggleThemeQuick(){
  theme.mode = theme.mode==='dark' ? 'light' : 'dark';
  DB.set('theme', theme); applyTheme();
}
function setAccent(preset){
  theme.accent = preset; DB.set('theme', theme); applyTheme();
  if(currentView==='settings') renderSettings();
}
function setStyle(style){
  theme.style = style; DB.set('theme', theme); applyTheme();
  if(currentView==='settings') renderSettings();
  toast('Gaya tampilan diperbarui: '+STYLE_PRESETS.find(s=>s.k===style).l);
}

}

/* ================= BOOT ================= */
function getTrackParams(){
  const p = new URLSearchParams(location.search);
  if(p.has('track')) return {code:p.get('track'), biz:p.get('biz'), cfg:p.get('c')};
  return null;
}
function boot(){
  const tp = getTrackParams();
  if(tp){ renderPublicTracker(tp); return; }
  if(fbConfig && fbConfig.apiKey && !DB.get('skipAuthSync', false) && !window._authGateDone){
    startAuthGate();
    return;
  }
  bootMain();
}
function startAuthGate(){
  try{
    if(!fbApp) fbApp = firebase.initializeApp(fbConfig);
    firebase.auth().onAuthStateChanged(user=>{
      window._authGateDone = true;
      if(user){
        authUser = {uid:user.uid, email:user.email||''};
        DB.set('authUser', authUser);
        const newBizId = user.uid;
        if(bizId !== newBizId){ bizId = newBizId; DB.set('bizId', bizId); window._cloudSyncStarted=false; _syncSnap={}; }
        fbDb = firebase.database(); fbReady = true;
        updateSyncPill();
        pullSettingsThenBoot();
      } else {
        authUser = null; DB.set('authUser', null);
        document.getElementById('app').classList.remove('ready');
        document.getElementById('gate').style.display='flex';
        renderGate('login');
      }
    });
  }catch(e){ window._authGateDone = true; bootMain(); }
}
function pullSettingsThenBoot(){
  if(!fbDb || !bizId){ bootMain(); return; }
  fbDb.ref('businesses/'+bizId+'/data/settings').once('value').then(snap=>{
    const remote = snap.val();
    if(remote && remote.setupDone && (!SETTINGS || !SETTINGS.setupDone)){
      SETTINGS = remote; localStorage.setItem('lyos_settings', JSON.stringify(SETTINGS));
    }
    bootMain();
  }).catch(()=>bootMain());
}
function authEmailSignIn(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  if(!email || !pass){ toast('Isi email dan kata sandi','⚠️'); return; }
  toast('Masuk...', '⏳');
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(e=>{
    toast('Gagal masuk: '+authErrMsg(e), '⚠️');
  });
}
function authEmailRegister(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  if(!email || !pass){ toast('Isi email dan kata sandi','⚠️'); return; }
  if(pass.length<6){ toast('Kata sandi minimal 6 karakter','⚠️'); return; }
  toast('Membuat akun...', '⏳');
  firebase.auth().createUserWithEmailAndPassword(email, pass).catch(e=>{
    toast('Gagal daftar: '+authErrMsg(e), '⚠️');
  });
}
function authErrMsg(e){
  const m = {
    'auth/email-already-in-use':'Email sudah terdaftar, coba menu Masuk',
    'auth/invalid-email':'Format email tidak valid',
    'auth/weak-password':'Kata sandi terlalu lemah (min. 6 karakter)',
    'auth/user-not-found':'Email belum terdaftar, coba menu Daftar Akun Baru',
    'auth/wrong-password':'Kata sandi salah',
    'auth/invalid-credential':'Email atau kata sandi salah',
    'auth/operation-not-allowed':'Login Email/Password belum diaktifkan di Firebase Console',
  };
  return m[e && e.code] || (e && e.message) || 'Terjadi kesalahan';
}
function skipGoogleSignIn(){
  DB.set('skipAuthSync', true);
  window._authGateDone = true;
  bootMain();
}
function signOutAuth(){
  if(!confirm('Keluar dari akun ini? Device ini perlu masuk ulang untuk sinkron lagi.')) return;
  firebase.auth().signOut().then(()=>{ DB.set('skipAuthSync', false); location.reload(); });
}
function settingsAuthAction(mode){
  const emailEl = document.getElementById('set-auth-email');
  const passEl = document.getElementById('set-auth-pass');
  const email = emailEl ? emailEl.value.trim() : '';
  const pass = passEl ? passEl.value : '';
  if(!email || !pass){ toast('Isi email dan kata sandi','⚠️'); return; }
  if(mode==='register' && pass.length<6){ toast('Kata sandi minimal 6 karakter','⚠️'); return; }
  if(!fbConfig || !fbConfig.apiKey){ toast('Simpan konfigurasi Firebase dulu','⚠️'); return; }
  try{ if(!fbApp) fbApp = firebase.initializeApp(fbConfig); }catch(e){}
  toast(mode==='register' ? 'Membuat akun...' : 'Masuk...', '⏳');
  const action = mode==='register'
    ? firebase.auth().createUserWithEmailAndPassword(email, pass)
    : firebase.auth().signInWithEmailAndPassword(email, pass);
  action.then(()=>{
    DB.set('skipAuthSync', false);
    toast('Berhasil! Menyinkronkan data ke akun ini...', '✅');
    setTimeout(()=>location.reload(), 700);
  }).catch(e=>{
    toast((mode==='register' ? 'Gagal daftar: ' : 'Gagal masuk: ') + authErrMsg(e), '⚠️');
  });
}
function bootMain(){
  if(!SETTINGS || !SETTINGS.setupDone){ document.getElementById('app').classList.remove('ready'); document.getElementById('gate').style.display='flex'; renderGate('setup'); return; }
  if(!services){ services = DEFAULT_SERVICES(SETTINGS.pricePerKg||7000); DB.set('services', services); }
  if(!bizId){ bizId = uid('biz_'); DB.set('bizId', bizId); }
  if(!fbReady) initFirebase(); else startCloudDataSync();
  if(!activeKasir){ document.getElementById('app').classList.remove('ready'); document.getElementById('gate').style.display='flex'; renderGate('attendance'); return; }
  document.getElementById('gate').style.display='none';
  document.getElementById('app').classList.add('ready');
  document.getElementById('brand-name').textContent = SETTINGS.businessName;
  document.getElementById('brand-addr').textContent = SETTINGS.address;
  document.getElementById('active-emp').textContent = activeKasir;
  updateShiftTimer();
  clearInterval(window._shiftTimerInt);
  window._shiftTimerInt = setInterval(updateShiftTimer, 30000);
  applyTheme();
  applyNavMode();
  renderNav();
  renderFab();
  if(!window._backGuardInit){ window._backGuardInit = true; initBackButtonGuard(); }
  navigate('dashboard');
  setTimeout(()=>{
    const startToday = new Date(todayStr()+'T00:00:00').getTime();
    const pending = orders.filter(o=>o.status!=='selesai');
    const n = pending.filter(o=>orderDeadline(o) <= new Date(todayStr()+'T23:59:59').getTime()).length;
    if(n>0) toast('⏰ '+n+' pesanan wajib diantar hari ini — cek Dashboard', '⏰');
  }, 700);
}
function renderFab(){
  const fab = document.getElementById('fab');
  if(!fab) return;
  fab.innerHTML = `
    <button class="fab-option" onclick="fabAction('shift')">🔁 Selesai / Ganti Shift</button>
    <button class="fab-option" onclick="fabAction('kas')">${ICONS.kas} Catat Belanja Laundry</button>
    <button class="fab-option" onclick="fabAction('scan')">${ICONS.shirtWash} Scan Progres</button>
    <button class="fab-option" onclick="fabAction('customer')">${ICONS.customers} Pelanggan Baru</button>
    <button class="fab-option" onclick="fabAction('order')">${ICONS.orders} Pesanan Baru</button>
    <button class="fab-main" id="fab-btn" onclick="toggleFab()">${ICONS.plus}</button>
  `;
}
function toggleFab(){ document.getElementById('fab').classList.toggle('open'); }
function closeFab(){ const f=document.getElementById('fab'); if(f) f.classList.remove('open'); }
function fabAction(type){
  closeFab();
  if(type==='order') openNewOrder();
  else if(type==='customer') openCustomerForm();
  else if(type==='shift') logoutShift();
  else if(type==='scan'){ navigate('tracking'); openCameraScanner(); }
  else if(type==='kas'){ navigate('kas'); setTimeout(()=>openKasForm('out'),50); }
}
document.addEventListener('click', function(e){
  const fab = document.getElementById('fab');
  if(fab && fab.classList.contains('open') && !fab.contains(e.target)) fab.classList.remove('open');
  const box = document.getElementById('o-cust-suggest');
  const input = document.getElementById('o-cust-search');
  if(box && input && !input.contains(e.target) && !box.contains(e.target)) box.style.display='none';
});

/* External hardware barcode/QR scanners (USB/Bluetooth "HID keyboard-wedge"
   devices) type each character almost instantly and finish with Enter.
   If one fires while the Tracking page is open but no text field has focus,
   catch the burst here and route it to the same lookup as manual entry. */
let _hwScanBuf = '', _hwScanLastT = 0;
document.addEventListener('keydown', function(e){
  if(currentView!=='tracking') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return; // already handled by the focused field itself
  const now = Date.now();
  if(now - _hwScanLastT > 80) _hwScanBuf = ''; // gap too long = normal human typing, reset
  _hwScanLastT = now;
  if(e.key==='Enter'){
    if(_hwScanBuf.length>=3){ processScannedCodeAuto(extractCode(_hwScanBuf)); }
    _hwScanBuf=''; return;
  }
  if(e.key.length===1) _hwScanBuf += e.key;
});

/* ================= CLOUD DATA SYNC (multi-device, same bizId) ================= */
const SYNC_COLLECTIONS = ['orders','customers','kas','invTx','repairs','kosList','inventory','services','kasirLog','pickupRequests'];
const SYNC_OBJECTS = ['settings'];
const SYNC_GETTERS = {
  orders:()=>orders, customers:()=>customers, kas:()=>kas, invTx:()=>invTx,
  repairs:()=>repairs, kosList:()=>kosList, inventory:()=>inventory, services:()=>services, kasirLog:()=>kasirLog,
  pickupRequests:()=>pickupRequests,
};
const SYNC_SETTERS = {
  orders:v=>{orders=v;}, customers:v=>{customers=v;}, kas:v=>{kas=v;}, invTx:v=>{invTx=v;},
  repairs:v=>{repairs=v;}, kosList:v=>{kosList=v;}, inventory:v=>{inventory=v;}, services:v=>{services=v;}, kasirLog:v=>{kasirLog=v;},
  pickupRequests:v=>{pickupRequests=v;},
};
let _syncSnap = {};
let _applyingRemote = false;
function cloudSyncReady(){ return fbReady && fbDb && bizId; }
function seededKey(k){ return 'lyos_seeded_'+bizId+'_'+k; }
function hasSeeded(k){ return !!localStorage.getItem(seededKey(k)); }
function markSeeded(k){ localStorage.setItem(seededKey(k), '1'); }

function pushCollectionDiff(key, arr){
  if(!cloudSyncReady() || _applyingRemote) return;
  const prev = _syncSnap[key] || {};
  const nowMap = {};
  (arr||[]).forEach(rec=>{ if(rec && rec.id) nowMap[rec.id] = rec; });
  Object.keys(nowMap).forEach(id=>{
    const str = JSON.stringify(nowMap[id]);
    if(prev[id] !== str){
      fbDb.ref('businesses/'+bizId+'/data/'+key+'/'+id).set(nowMap[id]).catch(()=>{});
      prev[id] = str;
    }
  });
  Object.keys(prev).forEach(id=>{
    if(!nowMap[id]){ fbDb.ref('businesses/'+bizId+'/data/'+key+'/'+id).remove().catch(()=>{}); delete prev[id]; }
  });
  _syncSnap[key] = prev;
}
function pushObjectWhole(key, obj){
  if(!cloudSyncReady() || _applyingRemote) return;
  fbDb.ref('businesses/'+bizId+'/data/'+key).set(obj).catch(()=>{});
}
function refreshAfterRemoteChange(){
  try{
    updateSyncPill();
    if(document.getElementById('app').style.display!=='none' && VIEW_RENDERERS[currentView]) VIEW_RENDERERS[currentView]();
  }catch(e){}
}
function applyRemoteCollection(key, cloudValObj){
  const cloudArr = Object.values(cloudValObj||{});
  if(!hasSeeded(key)){
    // First-ever sync on this device for this collection: merge (union), never
    // silently delete, so no local data created before enabling sync is lost.
    const localArr = SYNC_GETTERS[key]();
    const map = {};
    cloudArr.forEach(rec=>{ if(rec&&rec.id) map[rec.id]=rec; });
    const cloudIds = new Set(Object.keys(map));
    let localOnly = [];
    localArr.forEach(rec=>{ if(rec&&rec.id && !map[rec.id]){ map[rec.id]=rec; localOnly.push(rec); } });
    const merged = Object.values(map);
    _applyingRemote = true;
    SYNC_SETTERS[key](merged);
    localStorage.setItem('lyos_'+key, JSON.stringify(merged));
    _applyingRemote = false;
    _syncSnap[key] = {};
    merged.forEach(rec=>{ _syncSnap[key][rec.id] = JSON.stringify(rec); });
    localOnly.forEach(rec=>{ fbDb.ref('businesses/'+bizId+'/data/'+key+'/'+rec.id).set(rec).catch(()=>{}); });
    markSeeded(key);
  } else {
    // Ongoing sync: cloud is authoritative (every local change already gets
    // pushed via DB.set), so mirror it directly — this correctly propagates
    // deletions made from other devices too. Skip if this is just our own
    // write echoing back (avoids redundant re-renders).
    const incomingMap = {};
    cloudArr.forEach(rec=>{ if(rec&&rec.id) incomingMap[rec.id]=JSON.stringify(rec); });
    const prevSnap = _syncSnap[key]||{};
    const prevKeys = Object.keys(prevSnap), incKeys = Object.keys(incomingMap);
    let same = prevKeys.length===incKeys.length;
    if(same){ for(const rid of incKeys){ if(prevSnap[rid]!==incomingMap[rid]){ same=false; break; } } }
    if(same) return;
    _applyingRemote = true;
    SYNC_SETTERS[key](cloudArr);
    localStorage.setItem('lyos_'+key, JSON.stringify(cloudArr));
    _applyingRemote = false;
    _syncSnap[key] = incomingMap;
  }
  refreshAfterRemoteChange();
}
function applyRemoteObject(key, val){
  if(!val) return;
  _applyingRemote = true;
  if(key==='settings'){ SETTINGS = val; }
  localStorage.setItem('lyos_'+key, JSON.stringify(val));
  _applyingRemote = false;
  refreshAfterRemoteChange();
}
function startCloudDataSync(){
  if(!cloudSyncReady() || window._cloudSyncStarted) return;
  window._cloudSyncStarted = true;
  SYNC_COLLECTIONS.forEach(key=>{
    fbDb.ref('businesses/'+bizId+'/data/'+key).on('value', snap=>{ applyRemoteCollection(key, snap.val()); });
  });
  SYNC_OBJECTS.forEach(key=>{
    fbDb.ref('businesses/'+bizId+'/data/'+key).on('value', snap=>{ applyRemoteObject(key, snap.val()); });
  });
}

/* ================= FIREBASE SYNC ================= */
function initFirebase(){
  updateSyncPill();
  if(!fbConfig || !fbConfig.apiKey || !fbConfig.databaseURL) return;
  try{
    if(!fbApp) fbApp = firebase.initializeApp(fbConfig);
    fbDb = firebase.database();
    fbReady = true;
    fbDb.ref('businesses/'+bizId+'/profile').set({name:SETTINGS.businessName, address:SETTINGS.address}).catch(()=>{});
    startCloudDataSync();
  }catch(e){ fbReady=false; console.warn('Firebase init gagal', e); }
  updateSyncPill();
}
function updateSyncPill(){
  const pill = document.getElementById('sync-pill');
  if(!pill) return;
  if(!navigator.onLine){ pill.innerHTML = '<span class="dot off"></span><span>📴 Offline</span>'; }
  else if(fbReady){ pill.innerHTML = '<span class="dot"></span><span>Tersambung Cloud</span>'; }
  else if(fbConfig && fbConfig.apiKey){ pill.innerHTML = '<span class="dot off"></span><span>Cloud Error</span>'; }
  else{ pill.innerHTML = '<span class="dot off"></span><span>Lokal</span>'; }
}
window.addEventListener('online', ()=>{ updateSyncPill(); toast('🌐 Kembali online'); });
window.addEventListener('offline', ()=>{ updateSyncPill(); toast('📴 Sedang offline — data tetap tersimpan di HP ini dan akan sinkron otomatis saat online lagi', 'ℹ️'); });
function syncOrderToCloud(o){
  if(!fbReady) return;
  try{
    fbDb.ref('businesses/'+bizId+'/orders/'+o.code).set({
      code:o.code, customer:o.customer, weightKg:o.weightKg, serviceName:o.serviceName,
      total:o.total, paid:o.paid, status:o.status, statusHistory:o.statusHistory,
      createdAt:o.createdAt
    }).catch(()=>{});

function trackingUrlFor(code){
  let cfgParam = '';
  if(fbConfig && fbConfig.apiKey && fbConfig.databaseURL){
    try{
      const minimal = {apiKey:fbConfig.apiKey, databaseURL:fbConfig.databaseURL};
      cfgParam = '&c='+b64urlEncode(JSON.stringify(minimal));

/* ================= BACK-BUTTON / HISTORY HANDLING =================
   Goal: pressing Android/browser back should never abruptly close the app.
   Priority: (1) close an open modal/scanner, (2) step back to the previous
   screen the person was actually on, (3) only at the very root does it ask
   "yakin ingin keluar?" before actually allowing the app to exit. */
let viewHistory = ['dashboard'];
function pushNavGuard(){ try{ history.pushState({t:Date.now()}, '', location.href); }catch(e){} }
function initBackButtonGuard(){
  try{ history.replaceState({t:Date.now()}, '', location.href); }catch(e){}
  pushNavGuard(); // one extra entry so the very first back press is ours to catch
}
window.addEventListener('popstate', ()=>{
  // 1) Close a fullscreen scanner or modal first, if one is open.
  const scannerOpen = document.getElementById('scanner-overlay');
  if(scannerOpen){ closeCameraScanner(); pushNavGuard(); return; }
  const modalOpen = document.querySelector('.overlay');
  if(modalOpen){ closeModal(); pushNavGuard(); return; }
  const sidebarOpen = document.getElementById('sidebar') && document.getElementById('sidebar').classList.contains('open');
  if(sidebarOpen){ closeSidebar(); pushNavGuard(); return; }
  // 2) Step back through in-app view history.
  if(viewHistory.length > 1){
    viewHistory.pop();
    navigateSilent(viewHistory[viewHistory.length-1]);
    pushNavGuard();
    return;
  }
  // 3) Already at the root screen — confirm before actually exiting.
  if(confirm('Yakin ingin keluar dari aplikasi?')){
    history.back(); // let this one through — actually exits/minimizes the app
  } else {
    pushNavGuard(); // stay put
  }
});

  ov.addEventListener('click', e=>{ if(e.target===ov) closeModal(); });

function svcById(id){ return services.find(s=>s.id===id); }
function svcDurationDays(s){ return (s && s.durationDays!=null) ? s.durationDays : 2; }
// Groups services by groupName (new-style multi-tier services share a
// groupName + tierLabel). Legacy items without a groupName are treated as
// their own standalone "group of one" — fully backward compatible, nothing
// about existing data changes or needs migrating.
function serviceGroups(unitType){
  const map = {};
  const order = [];
  services.filter(s=> unitType ? s.unitType===unitType : true).forEach(s=>{
    const gname = s.groupName || s.name;
    if(!map[gname]){ map[gname] = {groupName:gname, unitType:s.unitType, tiers:[]}; order.push(gname); }
    map[gname].tiers.push(s);
  });
  return order.map(g=>map[g]);
}
function orderDeadline(o){
  const days = (o.estDays!=null) ? o.estDays : svcDurationDays(svcById(o.serviceId));
  return new Date(o.createdAt).getTime() + days*86400000;
}
/* ---- multi-item & diskon ---- */
function orderItems(o){
  const list = [];
  if(o.weightKg>0 || (o.serviceId && !o.detailIncomplete)){
    list.push({serviceName:o.serviceName, unit:'kg', qty:o.weightKg||0, price:o.pricePerKg||0, subtotal:(o.weightKg||0)*(o.pricePerKg||0)});
  }
  (o.extraItems||[]).forEach(it=> list.push(it));
  return list;
}
function orderSubtotal(o){ return orderItems(o).reduce((s,it)=>s+(it.subtotal||0),0); }
function computeDiscountAmount(subtotal, type, value){
  value = +value || 0;
  if(!type || !value) return 0;
  const amt = type==='percent' ? subtotal*value/100 : value;
  return Math.max(0, Math.min(subtotal, Math.round(amt)));
}
function recalcOrderTotal(o){
  o.subtotal = orderSubtotal(o);
  o.discountAmount = computeDiscountAmount(o.subtotal, o.discountType, o.discountValue);
  o.total = Math.max(0, o.subtotal - o.discountAmount);
  return o.total;
}
function deliveryFlag(o){
  if(o.status==='selesai') return null;
  const d = orderDeadline(o);
  const startToday = new Date(todayStr()+'T00:00:00').getTime();
  const endToday = new Date(todayStr()+'T23:59:59').getTime();
  if(d < startToday) return 'overdue';
  if(d <= endToday) return 'today';
  return null;
}

function customerUnpaidInfo(phone){
  const list = customerOrders(phone).filter(o=>!o.paid);
  const total = list.reduce((s,o)=>s+o.total,0);
  const oldestDays = list.length ? Math.floor((Date.now()-new Date(list[list.length-1].createdAt).getTime())/86400000) : 0;
  const maxDays = list.length ? Math.max(...list.map(o=>Math.floor((Date.now()-new Date(o.createdAt).getTime())/86400000))) : 0;
  return {list, total, count:list.length, maxDays};
}
function allUnpaidByCustomer(){
  const phones = [...new Set(orders.filter(o=>!o.paid && o.phone).map(o=>normPhone(o.phone)))];

/* =========================================================================
   KOS & KOMISI PENJAGA KOS
========================================================================= */
function customersInKos(kosId){ return customers.filter(c=>c.kosId===kosId); }
function kosMonthlyKg(kosId, monthStr){
  const phones = new Set(customersInKos(kosId).map(c=>normPhone(c.phone)).filter(Boolean));
  if(!phones.size) return 0;
  return orders.filter(o=> o.phone && phones.has(normPhone(o.phone)) && o.createdAt.slice(0,7)===monthStr)
    .reduce((s,o)=> s + orderItems(o).filter(it=>it.unit==='kg').reduce((s2,it)=>s2+(it.qty||0),0), 0);
}
function nextMonthStr(m){
  const [y, mo] = m.split('-').map(Number);
  let ny = y, nmo = mo + 1;
  if(nmo > 12){ nmo = 1; ny++; }
  return ny + '-' + String(nmo).padStart(2,'0');
}
function monthLabel(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString('id-ID',{month:'long',year:'numeric'}); }
/* Builds the month-by-month commission ledger for one kos: kg not reaching
   target accumulates ("carries") into the following month. Commission is
   earned in MULTIPLES of the target — e.g. if the running total reaches
   2.5x target in one month, that's 2x commission, and the leftover 0.5x
   carries into the next month. Payment status is tracked per month via
   kos.commissionPayouts (one payout entry covers that month's full,
   possibly-multiplied, commission amount). Returned oldest -> newest. */
function kosLedger(kosId){
  const k = kosList.find(x=>x.id===kosId); if(!k) return [];
  const target = k.targetKg||0;
  const phones = new Set(customersInKos(kosId).map(c=>normPhone(c.phone)).filter(Boolean));
  const monthsWithOrders = new Set();
  orders.forEach(o=>{ if(o.phone && phones.has(normPhone(o.phone))) monthsWithOrders.add(o.createdAt.slice(0,7)); });
  if(!monthsWithOrders.size) return [];
  const sorted = [...monthsWithOrders].sort();
  const nowMonth = new Date().toISOString().slice(0,7);
  let months = []; let cur = sorted[0];
  let guard = 0;
  while(cur <= nowMonth && guard < 1200){ months.push(cur); cur = nextMonthStr(cur); guard++; }
  const payouts = k.commissionPayouts||[];
  let carry = 0;
  return months.map(m=>{
    const kg = kosMonthlyKg(kosId, m);
    const carryIn = carry;
    const accum = carryIn + kg;
    const multiples = target>0 ? Math.floor(accum/target) : 0;
    const reached = multiples >= 1;
    let entry = {month:m, kg, carryIn, accum, target, reached, multiples, commission:0, paid:false, paidAt:null};
    if(reached){
      entry.commission = (k.commission||0) * multiples;
      const p = payouts.find(x=>x.month===m);
      entry.paid = p ? !!p.paid : false;
      entry.paidAt = p ? p.paidAt : null;
      carry = accum - multiples*target;
    } else {
      carry = accum;
    }
    return entry;
  }).reverse();
}
function togglePayout(kosId, month){
  const k = kosList.find(x=>x.id===kosId); if(!k) return;
  snapshot();
  k.commissionPayouts = k.commissionPayouts||[];
  let p = k.commissionPayouts.find(x=>x.month===month);
  if(!p){ p = {month, paid:false, paidAt:null}; k.commissionPayouts.push(p); }
  p.paid = !p.paid;
  p.paidAt = p.paid ? Date.now() : null;
  DB.set('kosList', kosList);
  toast(p.paid ? 'Komisi ditandai sudah dibayar' : 'Komisi ditandai belum dibayar');
  openKosLedgerModal(kosId);
  renderKosTable();
}

function renderKosTable(){
  const tb = document.getElementById('kos-tbody');
  if(!tb) return;
  const nowMonth = new Date().toISOString().slice(0,7);
  tb.innerHTML = kosList.map(k=>{
    const ledger = kosLedger(k.id);
    const thisMonth = ledger.find(e=>e.month===nowMonth);
    const kg = thisMonth ? thisMonth.kg : kosMonthlyKg(k.id, nowMonth);
    const accum = thisMonth ? thisMonth.accum : kg;
    const target = k.targetKg||0;
    const reached = thisMonth ? thisMonth.reached : (target>0 && accum>=target);
    const multiples = thisMonth ? thisMonth.multiples : (target>0 ? Math.floor(accum/target) : 0);
    const pct = target>0 ? Math.min(100, Math.round(accum/target*100)) : null;
    const unpaidCount = ledger.filter(e=>e.reached && !e.paid).length;
    return `
    <tr>
      <td style="font-weight:600;">${k.name}<div style="font-size:11px;color:var(--muted);font-weight:400;">${k.address||'-'}</div></td>
      <td>${k.keeperName||'<span style="color:var(--muted);">-</span>'}${k.keeperPhone?`<div style="font-size:11px;color:var(--muted);">${k.keeperPhone}</div>`:''}</td>
      <td>${customersInKos(k.id).length}</td>
      <td class="mono">${kg.toFixed(1)} kg</td>
      <td class="mono">${accum.toFixed(1)} kg${pct!=null?`<div style="font-size:11px;color:var(--muted);">${pct}% dari target</div>`:''}</td>
      <td class="mono">${target?target+' kg':'-'}</td>
      <td>${target>0 ? (reached?'<span class="badge b-green">Tercapai</span>':'<span class="badge b-amber">Belum, terakumulasi</span>') : '<span class="badge b-gray">Tanpa target</span>'}</td>
      <td>${unpaidCount>0?`<span class="badge b-red">${unpaidCount} belum dibayar</span>`:(ledger.some(e=>e.reached)?'<span class="badge b-green">Semua lunas</span>':'<span class="badge b-gray">-</span>')}</td>

      </td>
    </tr>`;
  }).join('') || '<tr class="empty-row"><td colspan="9">Belum ada data kos. Klik "Tambah Kos" atau tambahkan lewat menu Pelanggan.</td></tr>';
}

let custDetailSort = 'newest';
function sortCustOrders(list){
  const arr = list.slice();
  if(custDetailSort==='az') arr.sort((a,b)=>a.code.localeCompare(b.code,'id'));
  else if(custDetailSort==='za') arr.sort((a,b)=>b.code.localeCompare(a.code,'id'));
  else if(custDetailSort==='oldest') arr.sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  else arr.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)); // newest
  return arr;
}

  return [...new Set(orders.map(o=>o.createdAt.slice(0,7)))].sort().reverse();
}
function monthLabelId(m){
  if(m==='all') return 'Semua Bulan';
  const [y,mo] = m.split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString('id-ID', {month:'long', year:'numeric'});
}

function sortOrdersList(list){
  const sorted = list.slice();
  if(orderSort==='oldest') sorted.sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  else if(orderSort==='total-desc') sorted.sort((a,b)=>(b.total||0)-(a.total||0));
  else if(orderSort==='total-asc') sorted.sort((a,b)=>(a.total||0)-(b.total||0));
  else sorted.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  return sorted;
}
function ordersInCurrentFilter(){
  return orders.filter(o=>
    (o.code+o.customer).toLowerCase().includes(orderSearch.toLowerCase()) &&
    (orderMonthFilter==='all' || o.createdAt.slice(0,7)===orderMonthFilter)
  );

function exportOrdersMonthExcel(){
  const list = sortOrdersList(ordersInCurrentFilter());
  if(!list.length){ toast('Tidak ada data pesanan untuk diekspor pada periode ini','⚠️'); return; }
  const rows = list.map(o=>({
    Kode:o.code, Tanggal:fmtDateTime(o.createdAt), Pelanggan:o.customer, HP:o.phone||'',
    Layanan:orderItems(o).map(it=>it.serviceName+' ('+it.qty+(it.unit==='pcs'?'pcs':'kg')+')').join(', '),
    BeratKg:o.weightKg||0, Subtotal:o.subtotal!=null?o.subtotal:o.total, Diskon:o.discountAmount||0, Total:o.total,
    Status:(STATUSES.find(s=>s.k===o.status)||{}).l||o.status, Lunas:o.paid?'Ya':'Belum',
    MetodeBayar:o.paid?(PAYMENT_METHODS.find(p=>p.k===o.paymentMethod)||{}).l||'-':'-', DepositTerpakai:o.depositUsed||0, Catatan:o.notes||'', RincianSortir:o.sortNote||''
  }));
  const totalOmset = list.reduce((s,o)=>s+(o.total||0),0);
  const totalLunas = list.filter(o=>o.paid).reduce((s,o)=>s+(o.total||0),0);
  const summary = [{
    Periode: orderMonthFilter==='all' ? 'Semua Bulan' : monthLabelId(orderMonthFilter),
    JumlahPesanan: list.length, TotalOmset: totalOmset, SudahLunas: totalLunas, BelumLunas: totalOmset-totalLunas,
    DiekspornPada: fmtDateTime(new Date().toISOString())
  }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'Ringkasan');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Detail Pesanan');
  const label = orderMonthFilter==='all' ? 'Semua-Bulan' : orderMonthFilter;
  XLSX.writeFile(wb, 'Laporan-Pesanan-'+label+'.xlsx');

}

function filterCustomerSuggest(q){
  const box = document.getElementById('o-cust-suggest');
  q = (q||'').trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q)).slice(0,8);
  if(!matches.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = matches.map(c=>`
    <div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;" onmousedown="pickOrderCustomer('${c.id}')">
      <b>${c.name}</b>${(c.balance||0)>0?` <span style="color:var(--accent-d);font-weight:600;">💰 ${rupiah(c.balance)}</span>`:''}<div style="font-size:11.5px;color:var(--muted);">${c.phone||'-'}${c.subscriber?' · Langganan':''}</div>
    </div>`).join('');
  box.style.display = 'block';
}

function calcOrderTotal(){
  const isQuick = document.getElementById('o-quick')?.checked;
  const w = isQuick ? 0 : (+document.getElementById('o-weight').value || 0);
  const p = isQuick ? 0 : (+document.getElementById('o-price').value || 0);
  const extraSum = newOrderExtras.reduce((s,i)=>s+i.subtotal,0);
  const subtotal = w*p + extraSum;
  const discType = document.getElementById('o-disc-type').value;
  const discVal = +document.getElementById('o-disc-value').value || 0;
  const discAmt = computeDiscountAmount(subtotal, discType, discVal);
  document.getElementById('o-subtotal').textContent = rupiah(subtotal);
  document.getElementById('o-discount').textContent = '-'+rupiah(discAmt);
  document.getElementById('o-total').textContent = rupiah(subtotal-discAmt);
}
function saveOrder(){
  const customer = document.getElementById('o-customer').value.trim();
  if(!customer){ toast('Nama pelanggan wajib diisi','⚠️'); return; }
  snapshot();
  const isQuick = document.getElementById('o-quick').checked;
  const svcBtn = document.getElementById('o-service').querySelector('.chip.active');
  const svc = (!isQuick && svcBtn) ? (svcById(svcBtn.dataset.id) || {name:'Reguler'}) : null;
  const weight = isQuick ? 0 : (+document.getElementById('o-weight').value || 0);
  const price = isQuick ? 0 : (+document.getElementById('o-price').value || (svc?svc.price:0));
  const dt = document.getElementById('o-datetime').value;
  const createdAt = dt ? new Date(dt).toISOString() : new Date().toISOString();
  const code = 'LD' + Date.now().toString().slice(-8);
  const paidNow = !isQuick && document.getElementById('o-paid').checked;
  const payMethod = paidNow ? (document.getElementById('o-paymethod')?.value || 'cash') : null;
  const o = {
    id:uid('ord_'), code, customer, phone:document.getElementById('o-phone').value.trim(),
    weightKg:weight, serviceId:svc?svc.id:null, serviceName:svc?svc.name:'Belum ditentukan', pricePerKg:price,
    extraItems: isQuick ? [] : newOrderExtras.slice(),
    discountType: isQuick ? null : (document.getElementById('o-disc-type').value || null),
    discountValue: isQuick ? 0 : (+document.getElementById('o-disc-value').value || 0),
    estDays: svc?svcDurationDays(svc):2,
    detailIncomplete: isQuick,
    notes:document.getElementById('o-notes').value.trim(),
    sortNote:document.getElementById('o-sortnote').value.trim(),
    paid:paidNow, paymentMethod:payMethod,
    status:'masuk', createdAt,
    statusHistory:[{status:'masuk', time:Date.now(), by:activeKasir}],
    handledBy:activeKasir
  };
  recalcOrderTotal(o);
  orders.push(o); DB.set('orders', orders);
  upsertCustomerFromOrder(o);
  if(!o.paid && o.phone){
    const cust = custByPhone(o.phone);
    if(cust && (cust.balance||0) > 0){
      const applied = Math.min(cust.balance, o.total);
      if(applied > 0){
        cust.balance = Math.round(cust.balance - applied);
        o.depositUsed = applied;
        cust.depositLedger = cust.depositLedger || [];
        cust.depositLedger.push({id:uid('dep_'), date:Date.now(), type:'used', amount:applied, note:'Dipakai untuk pesanan '+code, orderId:o.id});
        if(applied >= o.total){ o.paid = true; o.paymentMethod = 'deposit'; }
        DB.set('customers', customers);
        DB.set('orders', orders);
        // This is the moment the money actually becomes the business's own
        // revenue (was just customer titipan until now), so it's recorded
        // in Kas Laundry right here — not when the deposit was topped up.
        kas.push({id:uid('kas_'), date:todayStr(), type:'in', category:'Pembayaran Pesanan', amount:applied, desc:'Pesanan '+code+' (Saldo Deposit)', orderId:o.id, source:'deposit'});
        DB.set('kas', kas);
      }
    }
  }
  if(o.paid && o.paymentMethod!=='deposit'){ kas.push({id:uid('kas_'), date:todayStr(), type:'in', category:'Pembayaran Pesanan', amount:o.total, desc:'Pesanan '+code+' ('+(PAYMENT_METHODS.find(p=>p.k===payMethod)||{}).l+')', orderId:o.id, source:'cash'}); DB.set('kas', kas); }
  syncOrderToCloud(o);
  closeModal(); toast(o.depositUsed ? (o.paid?'Pesanan '+code+' lunas otomatis dari saldo deposit 💰':'Pesanan '+code+' tersimpan — Rp'+o.depositUsed.toLocaleString('id-ID')+' otomatis dipakai dari deposit') : (isQuick ? 'Pesanan '+code+' dicatat — lengkapi detail nanti' : 'Pesanan '+code+' tersimpan'));
  navigate('orders');
  setTimeout(()=>openOrderDetail(o.id), 150);
}
function deleteOrder(id){
  if(!confirm('Hapus pesanan ini?')) return;
  snapshot();
  orders = orders.filter(o=>o.id!==id); DB.set('orders', orders);
  toast('Pesanan dihapus'); renderOrderTable();
}

function queueSortedOrders(){
  const active = orders.filter(o=>o.status!=='selesai');
  return active.map(o=>({o, deadline:orderDeadline(o)})).sort((a,b)=>{
    const qa = a.o.queueOrder, qb = b.o.queueOrder;
    if(qa!=null && qb!=null) return qa-qb;
    if(qa!=null) return -1;
    if(qb!=null) return 1;
    return a.deadline-b.deadline;
  }).map(x=>x.o);
}

  el.innerHTML = `

      <button class="btn btn-sm" onclick="resetQueueOrder()">↺ Reset ke Urutan Otomatis</button>

      <button class="btn btn-sm" onclick="copyQueueText()">${ICONS.copy} Salin sebagai Teks</button>

function moveQueue(id, dir){
  const queue = queueSortedOrders();
  const idx = queue.findIndex(o=>o.id===id);
  const swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=queue.length) return;
  // assign explicit sequential queueOrder to all items, then swap the two affected
  queue.forEach((o,i)=>{ o.queueOrder = i; });
  const tmp = queue[idx].queueOrder;
  queue[idx].queueOrder = queue[swapIdx].queueOrder;
  queue[swapIdx].queueOrder = tmp;
  DB.set('orders', orders);
  renderQueue();
}
function resetQueueOrder(){
  orders.forEach(o=>{ delete o.queueOrder; });
  DB.set('orders', orders);
  toast('Urutan antrian dikembalikan ke otomatis');
  renderQueue();
}
function exportQueueExcel(){
  const queue = queueSortedOrders();
  const rows = queue.map((o,i)=>({No:i+1, Kode:o.code, Pelanggan:o.customer, HP:o.phone, Layanan:o.serviceName, Status:STATUSES.find(s=>s.k===o.status).l, Deadline:fmtDateTime(orderDeadline(o))}));
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Antrian Servis');
  XLSX.writeFile(wb, 'Antrian-Servis-'+todayStr()+'.xlsx');
  toast('Antrian diekspor ke Excel');
}

function confirmEditPayment(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  snapshot();
  const status = document.getElementById('mp-status').value;
  // Deposit-sourced and cash-sourced (cash/transfer/qris) revenue for this
  // order are tracked as separate kas entries, since an order can be paid
  // partly from deposit (recognized as revenue immediately when spent) and
  // partly from a later cash/transfer/qris payment for the remainder.
  const depositKas = kas.find(k=>k.orderId===o.id && k.source==='deposit');
  const cashKas = kas.find(k=>k.orderId===o.id && k.source==='cash');
  const alreadyFromDeposit = o.depositUsed||0;
  const remainingDue = Math.max(0, o.total - alreadyFromDeposit);
  if(status==='paid'){
    const method = document.getElementById('mp-method').value;
    if(method==='deposit'){
      const cust = o.phone ? custByPhone(o.phone) : null;
      if(!cust || (cust.balance||0) < remainingDue){
        toast('⚠️ Saldo deposit pelanggan tidak cukup untuk melunasi sisa tagihan ini','⚠️');
        return;
      }
      if(remainingDue>0){
        cust.balance = Math.round(cust.balance - remainingDue);
        cust.depositLedger = cust.depositLedger || [];
        cust.depositLedger.push({id:uid('dep_'), date:Date.now(), type:'used', amount:remainingDue, note:'Pelunasan pesanan '+o.code, orderId:o.id});
        DB.set('customers', customers);
      }
      o.depositUsed = o.total; // fully covered by deposit now
      if(depositKas) depositKas.amount = o.depositUsed;
      else kas.push({id:uid('kas_'), date:todayStr(), type:'in', category:'Pembayaran Pesanan', amount:o.depositUsed, desc:'Pesanan '+o.code+' (Saldo Deposit)', orderId:o.id, source:'deposit'});
      if(cashKas) kas = kas.filter(k=>k!==cashKas); // no separate cash portion needed anymore
    } else {
      // Paying the remaining (non-deposit) portion via cash/transfer/qris.
      const desc = 'Pesanan '+o.code+' ('+(PAYMENT_METHODS.find(p=>p.k===method)||{}).l+')';
      if(cashKas){ if(remainingDue>0){ cashKas.amount = remainingDue; cashKas.desc = desc; } else { kas = kas.filter(k=>k!==cashKas); } }
      else if(remainingDue>0){ kas.push({id:uid('kas_'), date:todayStr(), type:'in', category:'Pembayaran Pesanan', amount:remainingDue, desc, orderId:o.id, source:'cash'}); }
    }
    o.paid = true; o.paymentMethod = method;
  } else {
    o.paid = false; o.paymentMethod = null;
    // Unmarking "lunas" only reverts the manual cash/transfer/qris portion.
    // Any deposit already spent on this order stays spent (and stays
    // recorded as revenue) — reversing that would mean refunding the
    // customer's deposit balance, which isn't assumed here.
    if(cashKas) kas = kas.filter(k=>k!==cashKas);
  }
  DB.set('orders', orders); DB.set('kas', kas);
  syncOrderToCloud(o);
  toast('Status pembayaran diperbarui'); closeModal(); openOrderDetail(id);
}

function extractCode(raw){

  try{ const u = new URL(raw); const c = u.searchParams.get('track'); if(c) return c.toUpperCase(); }catch(e){}

}

function processScannedCode(code){
  const o = orders.find(x=>x.code.toUpperCase()===code);

  if(!o){ box.innerHTML = `<div class="card" style="background:var(--red-l);border:none;margin-top:12px;color:var(--red);font-size:13px;">Kode "${code}" tidak ditemukan.</div>`; return; }

function processScannedCodeAuto(code){
  // Used by camera/gallery scan — unlike manual code entry, this advances
  // the order status immediately (no extra confirm tap needed) and shows a
  // clear "maju ke: ..." notification, since scanning is meant to be a
  // one-motion action during sorting/packing.
  const o = orders.find(x=>x.code.toUpperCase()===code);
  if(!o){ toast('⚠️ Kode "'+code+'" tidak ditemukan', '⚠️'); return; }
  const idx = STATUSES.findIndex(s=>s.k===o.status);
  if(idx>=STATUSES.length-1){ toast('ℹ️ Pesanan '+o.code+' sudah di status akhir: '+STATUSES[idx].l, 'ℹ️'); openOrderDetail(o.id); return; }
  snapshot();
  const nextIdx = idx+1;
  o.status = STATUSES[nextIdx].k;
  o.statusHistory.push({status:o.status, time:Date.now(), by:activeKasir});
  DB.set('orders', orders);
  syncOrderToCloud(o);
  toast('✅ '+o.code+' — progres maju ke: "'+STATUSES[nextIdx].l+'"', '✅');
  if(currentView==='tracking') renderTracking();

function openCameraScanner(){
  if(document.getElementById('scanner-overlay')) return;
  const ov = document.createElement('div');
  ov.className = 'scanner-overlay'; ov.id = 'scanner-overlay';
  ov.innerHTML = `
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="scanner-topbar">
      <button onclick="closeCameraScanner()">✕</button>
      <div style="font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;"><span style="width:18px;height:18px;display:inline-flex;">${ICONS.shirtWash}</span>Scan QR Nota</div>
      <button id="scan-torch-btn" onclick="toggleTorch()" style="display:none;">🔦</button>
    </div>
    <div class="scanner-frame"><div class="corner2"></div><div class="corner3"></div><div class="scan-line"></div></div>
    <div class="scanner-hint">Arahkan kamera ke QR code pada nota</div>
    <div class="scanner-bottombar">
      <button onclick="closeCameraScanner()">Batal</button>
      <label class="scanner-gallery-btn">${ICONS.upload} Galeri<input type="file" accept="image/*" style="display:none;" onchange="closeCameraScanner(); scanFromGalleryFile(this.files[0]); this.value='';"></label>
    </div>
  `;
  document.body.appendChild(ov);
  const fab = document.getElementById('fab'); if(fab) fab.style.display='none';
  const video = document.getElementById('scan-video');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(stream=>{
    scannerStream = stream; video.srcObject = stream; video.play();
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps.torch){ const tb=document.getElementById('scan-torch-btn'); if(tb) tb.style.display='flex'; }
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', {willReadFrequently:true});
    let busy = false;
    function tick(){
      if(!scannerStream) return;
      if(!busy && video.readyState===video.HAVE_ENOUGH_DATA && video.videoWidth){
        busy = true;
        // Downscale before decoding — running jsQR on the raw camera feed
        // (often 1080p+) every single frame was heavy enough to visibly lag
        // and miss detections, especially scanning a QR shown on another
        // phone's screen (glare + the extra processing time compounding).
        const MAX_SIDE = 900;
        const scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth*scale); canvas.height = Math.round(video.videoHeight*scale);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
        if(code && code.data){
          if(navigator.vibrate) navigator.vibrate(80);
          processScannedCodeAuto(extractCode(code.data));
          closeCameraScanner();
          return;
        }
        busy = false;
      }
      scannerRAF = requestAnimationFrame(tick);
    }
    tick();
  }).catch(()=>{ toast('Kamera tidak dapat diakses — cek izin kamera di pengaturan HP','⚠️'); closeCameraScanner(); });
}
function toggleTorch(){
  if(!scannerStream) return;
  const track = scannerStream.getVideoTracks()[0];
  const settings = track.getSettings ? track.getSettings() : {};
  track.applyConstraints({advanced:[{torch: !settings.torch}]}).catch(()=>{});
}
function closeCameraScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const ov = document.getElementById('scanner-overlay'); if(ov) ov.remove();
  const fab = document.getElementById('fab'); if(fab) fab.style.display='';
}
function stopScanner(){ closeCameraScanner(); } // kept as an alias since closeModal() calls stopScanner() defensively
function scanFromGalleryFile(file){
  if(!file) return;
  try{ stopScanner(); }catch(e){}
  toast('Membaca gambar...', '⏳');
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    requestAnimationFrame(() => setTimeout(() => {
      URL.revokeObjectURL(url);
      if(!img.naturalWidth){ toast('Gambar tidak valid / rusak','⚠️'); return; }
      tryDecodeQR(img, 0);
    }, 30));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Gagal membaca file gambar — format mungkin tidak didukung (coba JPG/PNG)','⚠️'); };
  img.src = url;
}
// Progressive attempts: start small & fast (covers most cases — screenshots,
// nota images, well-framed close-up photos), then retry at higher
// resolution only if needed (covers a QR that's a small part of a bigger
// photo, e.g. a printed nota photographed from normal distance). This
// balances speed against accuracy instead of picking one fixed size.
const QR_SCAN_STAGES = [900, 1800, 2800];
function tryDecodeQR(img, stageIdx){
  const MAX_SIDE = QR_SCAN_STAGES[stageIdx];
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  let code = null;
  try{
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h);
    code = jsQR(data.data, data.width, data.height, {inversionAttempts:'attemptBoth'});
  }catch(e){ /* fall through to next stage / final failure below */ }
  if(code && code.data){ processScannedCodeAuto(extractCode(code.data)); return; }
  const next = stageIdx+1;
  if(next < QR_SCAN_STAGES.length && (img.naturalWidth>MAX_SIDE || img.naturalHeight>MAX_SIDE)){
    if(next===QR_SCAN_STAGES.length-1) toast('Belum ketemu, mencoba resolusi lebih tinggi...', '⏳');
    setTimeout(()=>tryDecodeQR(img, next), 20);
  } else {
    toast('QR code tidak terbaca dari gambar ini — coba foto yang lebih fokus, terang, dan QR terlihat penuh','⚠️');
  }
}

function openInvForm(){

      </div>
      <div class="field-row">
        <div class="field"><label>Stok minimum</label><input id="i-min" type="number" value="1"></div>
        <div class="field"><label>Harga per unit</label><input id="i-price" type="number" value="0"></div>

    </div>

function saveInv(){
  const name = document.getElementById('i-name').value.trim();
  if(!name){ toast('Nama barang wajib diisi','⚠️'); return; }
  snapshot();
  inventory.push({id:uid('inv_'), name, qty:+document.getElementById('i-qty').value||0, unit:document.getElementById('i-unit').value||'pcs', minStock:+document.getElementById('i-min').value||1, pricePerUnit:+document.getElementById('i-price').value||0});
  DB.set('inventory', inventory); closeModal(); toast('Barang ditambahkan'); renderInventory();
}
function deleteInv(id){ if(!confirm('Hapus barang ini?'))return; snapshot(); inventory=inventory.filter(i=>i.id!==id); DB.set('inventory',inventory); renderInventory(); }
function openInvTx(id, type){
  const item = inventory.find(i=>i.id===id);
  openModal(`
    <div class="modal-head"><h3>${type==='in'?'Stok Masuk':'Stok Keluar'} — ${item.name}</h3><button class="x-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Jumlah (${item.unit})</label><input id="tx-qty" type="number" value="1"></div>
      <div class="field"><label>Catatan</label><input id="tx-note" placeholder="cth. pembelian dari toko X"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveInvTx('${id}','${type}')">Simpan</button></div>
  `);
}
function saveInvTx(id, type){
  const item = inventory.find(i=>i.id===id);
  const qty = +document.getElementById('tx-qty').value || 0;
  if(qty<=0){ toast('Jumlah tidak valid','⚠️'); return; }
  snapshot();
  item.qty += (type==='in'? qty : -qty);
  invTx.push({id:uid('tx_'), itemId:id, type, qty, date:todayStr(), note:document.getElementById('tx-note').value.trim()});
  if(type==='in'){ kas.push({id:uid('kas_'), date:todayStr(), type:'out', category:'Pembelian Stok', amount:qty*item.pricePerUnit, desc:'Beli '+item.name}); DB.set('kas',kas); }
  DB.set('inventory', inventory); DB.set('invTx', invTx);
  closeModal(); toast('Transaksi tersimpan'); renderInventory();
}
