/* =========================================================================
   REPORT — omset, keuntungan, target, rekomendasi SDM, + REKAP PERIODE
========================================================================= */
let reportChart = null;
function renderReport(){
  const cfg = DB.get('reportCfg', {employees:2, hoursPerEmp:8, kgPerHourPerEmp:4});
  const el = document.getElementById('view');

  const days30 = [...Array(30)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(29-i)); return d.toISOString().slice(0,10); });
  const periodLabel = fmtDate(days30[0]) + ' – ' + fmtDate(days30[29]);
  const omsetByDay = days30.map(d=> orders.filter(o=>o.createdAt.slice(0,10)===d).reduce((s,o)=>s+o.total,0));
  const totalOmset30 = omsetByDay.reduce((a,b)=>a+b,0);
  const kasOut30 = kas.filter(k=>k.type==='out' && days30.includes(k.date)).reduce((s,k)=>s+k.amount,0);
  const keuntungan30 = totalOmset30 - kasOut30;
  const target = SETTINGS.targetOmset || 10000000;
  const progressPct = Math.min(100, Math.round(totalOmset30/target*100));
  const totalKgThisPeriod = orders.filter(o=>days30.includes(o.createdAt.slice(0,10))).reduce((s,o)=>s+o.weightKg,0);
  const avgKgPerDay = totalKgThisPeriod/30;

  el.innerHTML = `
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">📅 Periode berjalan: <b style="color:var(--ink);">${periodLabel}</b> (30 hari terakhir) — diperbarui otomatis, ${fmtDateTime(new Date().toISOString())}</div>
    <div class="grid grid-4">
      <div class="card stat"><div class="label">Omset 30 Hari</div><div class="value">${rupiah(totalOmset30)}</div></div>
      <div class="card stat"><div class="label">Pengeluaran 30 Hari</div><div class="value" style="color:var(--red)">${rupiah(kasOut30)}</div></div>
      <div class="card stat"><div class="label">Estimasi Keuntungan</div><div class="value" style="color:var(--green)">${rupiah(keuntungan30)}</div></div>
      <div class="card stat"><div class="label">Rata² Volume /Hari</div><div class="value">${avgKgPerDay.toFixed(1)} kg</div></div>
    </div>

    <div class="section-head"><h3>Tren Omset (${periodLabel})</h3></div>
    <div class="card"><canvas id="chart-omset" height="90"></canvas></div>

    <div class="section-head"><h3>📊 Rekap Laporan per Periode</h3></div>
    <div class="card">
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Pilih rentang tanggal (harian, bulanan, atau tahunan) untuk membuat rekap lengkap — omset, pengeluaran, breakdown layanan — lalu unduh sebagai file dengan tanggal, bulan, dan tahun tercantum jelas.</p>
      <div class="field-row">
        <div class="field"><label>Dari tanggal</label><input id="rk-start" type="date" value="${days30[0]}"></div>
        <div class="field"><label>Sampai tanggal</label><input id="rk-end" type="date" value="${todayStr()}"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
        <button class="btn btn-sm" onclick="setRekapPreset('month')">Bulan Ini</button>
        <button class="btn btn-sm" onclick="setRekapPreset('lastmonth')">Bulan Lalu</button>
        <button class="btn btn-sm" onclick="setRekapPreset('year')">Tahun Ini</button>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="runRekap()">Tampilkan Rekap</button>
      <div id="rekap-box" style="margin-top:16px;"></div>
    </div>

    <div class="section-head" style="margin-top:32px;"><h3>Target Bulanan</h3></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;">
        <span>Target: <b class="mono">${rupiah(target)}</b></span><span class="mono">${progressPct}%</span>
      </div>
      <div class="progress-bar"><div style="width:${progressPct}%"></div></div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">${totalOmset30>=target ? 'Target 30 hari tercapai 🎉' : 'Kurang '+rupiah(target-totalOmset30)+' lagi untuk mencapai target.'} (periode ${periodLabel})</div>
      <div class="field" style="margin-top:14px;max-width:260px;"><label>Ubah target omset /bulan</label><input id="target-input" type="number" value="${target}"></div>
      <button class="btn btn-sm" onclick="updateTarget()">Simpan Target</button>
    </div>

    <div class="section-head"><h3>Rekomendasi Jumlah Karyawan &amp; Jam Kerja</h3></div>
    <div class="card">
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Masukkan asumsi operasional untuk menghitung apakah kapasitas SDM sudah sesuai dengan volume cucian rata-rata (${periodLabel}).</p>
      <div class="grid grid-3">
        <div class="field"><label>Jumlah karyawan</label><input id="cfg-emp" type="number" value="${cfg.employees}"></div>
        <div class="field"><label>Jam kerja /karyawan /hari</label><input id="cfg-hours" type="number" value="${cfg.hoursPerEmp}"></div>
        <div class="field"><label>Kapasitas cuci (kg/jam/karyawan)</label><input id="cfg-kgph" type="number" step="0.1" value="${cfg.kgPerHourPerEmp}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Jam buka</label><input id="cfg-open" type="time" value="${SETTINGS.openTime}"></div>
        <div class="field"><label>Jam tutup</label><input id="cfg-close" type="time" value="${SETTINGS.closeTime}"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="runRecommendation()">Hitung Rekomendasi</button>
      <div id="reco-box" style="margin-top:16px;"></div>
    </div>
  `;
  const ctx = document.getElementById('chart-omset');
  if(reportChart) reportChart.destroy();
  const gridColor = theme.mode==='dark' ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  const textColor = theme.mode==='dark' ? '#8B98B3' : '#64748B';
  reportChart = new Chart(ctx, {
    type:'line',
    data:{ labels: days30.map(d=>d.slice(5)), datasets:[{ label:'Omset', data: omsetByDay, borderColor: theme.accent.base, backgroundColor: theme.accent.light, fill:true, tension:.35, pointRadius:0, borderWidth:2 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ ticks:{color:textColor}, grid:{color:gridColor} }, y:{ ticks:{ color:textColor, callback:v=>'Rp'+(v/1000)+'k' }, grid:{color:gridColor} } } }
  });
  runRecommendation(true);
}
function setRekapPreset(kind){
  const now = new Date();
  let start, end;
  if(kind==='month'){ start = new Date(now.getFullYear(), now.getMonth(), 1); end = now; }
  else if(kind==='lastmonth'){ start = new Date(now.getFullYear(), now.getMonth()-1, 1); end = new Date(now.getFullYear(), now.getMonth(), 0); }
  else if(kind==='year'){ start = new Date(now.getFullYear(), 0, 1); end = now; }
  document.getElementById('rk-start').value = start.toISOString().slice(0,10);
  document.getElementById('rk-end').value = end.toISOString().slice(0,10);
  runRekap();
}
function updateTarget(){
  SETTINGS.targetOmset = +document.getElementById('target-input').value || SETTINGS.targetOmset;
  DB.set('settings', SETTINGS); toast('Target tersimpan'); renderReport();
}
function runRecommendation(silent){
  const employees = +document.getElementById('cfg-emp').value || 1;
  const hoursPerEmp = +document.getElementById('cfg-hours').value || 8;
  const kgPerHour = +document.getElementById('cfg-kgph').value || 4;
  const open = document.getElementById('cfg-open').value || SETTINGS.openTime;
  const close = document.getElementById('cfg-close').value || SETTINGS.closeTime;
  DB.set('reportCfg', {employees, hoursPerEmp, kgPerHourPerEmp:kgPerHour});

  const [oh,om]=open.split(':').map(Number), [ch,cm]=close.split(':').map(Number);
  let openHours = (ch+cm/60)-(oh+om/60); if(openHours<=0) openHours+=24;

  const days30 = [...Array(30)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(29-i)); return d.toISOString().slice(0,10); });
  const totalKg = orders.filter(o=>days30.includes(o.createdAt.slice(0,10))).reduce((s,o)=>s+o.weightKg,0);
  const avgKgPerDay = totalKg/30 || 0;

  const capacityPerDay = employees*hoursPerEmp*kgPerHour;
  const utilPct = capacityPerDay>0 ? Math.round(avgKgPerDay/capacityPerDay*100) : 0;
  const idealEmployees = Math.max(1, Math.ceil(avgKgPerDay/(hoursPerEmp*kgPerHour)));

  let verdict, verdictClass;
  if(utilPct<50){ verdict = `Kapasitas SDM lebih dari cukup (pemakaian ${utilPct}%). ${employees} karyawan × ${hoursPerEmp} jam sudah menutupi rata-rata ${avgKgPerDay.toFixed(1)} kg/hari dengan longgar — pertimbangkan menambah jam operasional/promosi untuk memaksimalkan kapasitas, bukan menambah karyawan.`; verdictClass='b-green'; }
  else if(utilPct<=85){ verdict = `Kapasitas seimbang (pemakaian ${utilPct}%). Jumlah karyawan saat ini (${employees} orang, ${hoursPerEmp} jam/hari) sesuai dengan volume rata-rata ${avgKgPerDay.toFixed(1)} kg/hari.`; verdictClass='b-teal'; }
  else{ verdict = `Kapasitas SDM mulai kewalahan (pemakaian ${utilPct}%). Disarankan menambah minimal ${Math.max(1, idealEmployees-employees)} karyawan (total ${idealEmployees} orang) atau menambah jam kerja, agar tidak terjadi keterlambatan pesanan.`; verdictClass='b-amber'; }

  document.getElementById('reco-box').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:10px;">
      <div class="card" style="padding:12px;"><div class="label" style="font-size:11px;color:var(--muted)">Kapasitas Harian</div><div style="font-weight:700;font-family:'Fraunces'">${capacityPerDay.toFixed(0)} kg</div></div>
      <div class="card" style="padding:12px;"><div class="label" style="font-size:11px;color:var(--muted)">Rata² Volume Masuk</div><div style="font-weight:700;font-family:'Fraunces'">${avgKgPerDay.toFixed(1)} kg/hari</div></div>
      <div class="card" style="padding:12px;"><div class="label" style="font-size:11px;color:var(--muted)">Pemakaian Kapasitas</div><div style="font-weight:700;font-family:'Fraunces'">${utilPct}%</div></div>
    </div>
    <div class="card" style="padding:14px;background:var(--surface-alt);"><span class="badge ${verdictClass}" style="margin-bottom:8px;">Rekomendasi</span><p style="font-size:13px;margin:8px 0 0;line-height:1.55;">${verdict}</p></div>
  `;
  if(!silent) toast('Rekomendasi diperbarui');
}
function computeRekap(start, end){
  const inRange = d => d>=start && d<=end;
  const os = orders.filter(o=>inRange(o.createdAt.slice(0,10)));
  const ks = kas.filter(k=>inRange(k.date));
  const rp = repairs.filter(r=>inRange(r.date));
  const omset = os.reduce((s,o)=>s+o.total,0);
  const kasIn = ks.filter(k=>k.type==='in').reduce((s,k)=>s+k.amount,0);
  const kasOut = ks.filter(k=>k.type==='out').reduce((s,k)=>s+k.amount,0);
  const repairCost = rp.reduce((s,r)=>s+r.cost,0);
  const byService = {};
  os.forEach(o=>{ byService[o.serviceName] = byService[o.serviceName] || {count:0, kg:0, omset:0}; byService[o.serviceName].count++; byService[o.serviceName].kg += o.weightKg; byService[o.serviceName].omset += o.total; });
  return {os, ks, rp, omset, kasIn, kasOut, repairCost, keuntungan: omset-kasOut, byService, totalKg: os.reduce((s,o)=>s+o.weightKg,0)};
}

/* ================= BLUETOOTH THERMAL PRINTER (ESC/POS) ================= */
// Works with common 58mm/80mm BLE thermal printers that expose a generic
// serial-style GATT write characteristic (the pattern used by most cheap
// "POS-58/Zjiang/Goojprt"-style clone printers). Requires Chrome/Edge on
// Android or desktop with Web Bluetooth support — NOT supported on iOS
// Safari (Apple does not allow Web Bluetooth), and not all printer brands
// expose Bluetooth this way (some use classic Bluetooth SPP instead of BLE,
// which browsers can't access at all — those need the printer maker's app).
let btPrinter = { device:null, char:null };
const BT_KNOWN_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455'];
function bluetoothSupported(){ return !!navigator.bluetooth; }
async function connectBluetoothPrinter(){
  if(!bluetoothSupported()){ toast('⚠️ Browser/HP ini tidak mendukung Web Bluetooth (coba Chrome Android, bukan Safari/iOS)', '⚠️'); return false; }
  try{
    toast('Mencari printer Bluetooth di sekitar...', '⏳');
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices: BT_KNOWN_SERVICES });
    const server = await device.gatt.connect();
    let writeChar = null;
    const services = await server.getPrimaryServices();
    for(const svc of services){
      const chars = await svc.getCharacteristics().catch(()=>[]);
      const found = chars.find(c=>c.properties.write || c.properties.writeWithoutResponse);
      if(found){ writeChar = found; break; }
    }
    if(!writeChar){ toast('Printer tersambung tapi tidak ditemukan jalur cetak (karakteristik write) — printer ini mungkin tidak didukung browser','⚠️'); return false; }
    btPrinter = { device, char: writeChar };
    device.addEventListener('gattserverdisconnected', ()=>{ btPrinter = {device:null, char:null}; });
    toast('🔵 Printer "'+(device.name||'Bluetooth')+'" tersambung', '✅');
    return true;
  }catch(e){
    if(e && e.name==='NotFoundError'){ toast('Dibatalkan — tidak ada printer dipilih'); }
    else toast('Gagal menyambungkan printer Bluetooth','⚠️');
    return false;
  }
}
async function btWrite(bytes){
  // BLE writes are typically capped ~20 bytes per packet on many stacks — chunk conservatively.
  const CHUNK = 180;
  for(let i=0;i<bytes.length;i+=CHUNK){
    const slice = bytes.slice(i, i+CHUNK);
    if(btPrinter.char.properties.writeWithoutResponse) await btPrinter.char.writeValueWithoutResponse(slice);
    else await btPrinter.char.writeValue(slice);
    await new Promise(r=>setTimeout(r, 12));
  }
}
function canvasToEscPosRaster(canvas, widthPx){
  // Downscale/threshold the nota canvas to 1-bit monochrome and wrap it in
  // an ESC/POS "GS v 0" raster print command, which most ESC/POS thermal
  // printers support regardless of brand.
  const scale = widthPx / canvas.width;
  const w = widthPx, h = Math.round(canvas.height * scale);
  const tmp = document.createElement('canvas'); tmp.width=w; tmp.height=h;
  const ctx = tmp.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(canvas, 0, 0, w, h);
  const img = ctx.getImageData(0,0,w,h).data;
  const bytesPerRow = Math.ceil(w/8);
  const raster = new Uint8Array(bytesPerRow*h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      const lum = 0.299*img[idx]+0.587*img[idx+1]+0.114*img[idx+2];
      if(lum < 165){ raster[y*bytesPerRow + (x>>3)] |= (0x80 >> (x&7)); }
    }
  }
  const header = new Uint8Array([0x1D,0x76,0x30,0x00, bytesPerRow&0xFF,(bytesPerRow>>8)&0xFF, h&0xFF,(h>>8)&0xFF]);
  const init = new Uint8Array([0x1B,0x40]); // ESC @ (reset)
  const feedCut = new Uint8Array([0x1B,0x64,0x03]); // feed 3 lines
  const out = new Uint8Array(init.length+header.length+raster.length+feedCut.length);
  out.set(init,0); out.set(header, init.length); out.set(raster, init.length+header.length); out.set(feedCut, init.length+header.length+raster.length);
  return out;
}
async function printNotaBluetooth(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(!btPrinter.char){ const ok = await connectBluetoothPrinter(); if(!ok) return; }
  toast('Menyiapkan cetakan...', '⏳');
  try{
    const canvas = await notaCanvas();
    const widthPx = (SETTINGS.printerWidthMm===80) ? 576 : 384;
    const data = canvasToEscPosRaster(canvas, widthPx);
    await btWrite(data);
    toast('🔵 Nota terkirim ke printer', '✅');
  }catch(e){
    toast('Gagal mencetak via Bluetooth — pastikan printer masih menyala & tersambung','⚠️');
  }
}
function notaCanvas(){
  const el = document.getElementById('nota-inner');
  if(!el || typeof html2canvas==='undefined') return Promise.reject(new Error('not-ready'));
  return html2canvas(el, {scale:2.5, backgroundColor:'#ffffff', useCORS:true});

function downloadNotaImage(id){
  const o = orders.find(x=>x.id===id); if(!o) return;

    canvas.toBlob(blob=>{

      const a = document.createElement('a');
      a.href = url; a.download = `Nota-${o.code}.png`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Gambar nota (beserta QR) diunduh');
    }, 'image/png');
  }).catch(()=>toast('Fitur gambar belum siap, coba lagi','⚠️'));
}
function shareNotaImage(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  toast('Menyiapkan gambar...', '⏳');
  notaCanvas().then(canvas=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Gagal membuat gambar','⚠️'); return; }
      const fileName = `Nota-${o.code}.png`;
      const waText = `Nota pesanan ${o.code} — ${SETTINGS.businessName}. Gambar nota terlampir, mohon dicek ya 🙏`;
      const hasPhone = !!o.phone;

      // Best case: native share sheet with the actual image file attached —
      // on Android/iOS this lets the admin pick WhatsApp + the customer's
      // chat directly, and the image goes through as a real attachment
      // (not just text), unlike clipboard-paste which many WA builds don't
      // accept reliably.
      const file = new File([blob], fileName, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Nota Pesanan '+o.code, text: waText});
          return;
        }catch(e){ if(e && e.name==='AbortError') return; }
      }

      // Fallback: try copying the image to clipboard so it can be pasted
      // into the WA chat manually.
      let copied = false;
      try{
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          copied = true;
        }
      }catch(e){ copied = false; }

      // Always also download the file, so the image is guaranteed to be
      // saved even if clipboard/share isn't supported on this browser —
      // this is what the admin attaches manually if paste doesn't work.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);

      if(hasPhone) window.open(waLink(o.phone, waText), '_blank');
      if(copied) toast(hasPhone ? 'Gambar disalin & diunduh — di chat WA tempel (paste) gambarnya, atau lampirkan dari galeri' : 'Gambar disalin & diunduh — tempel (paste) di WhatsApp atau lampirkan dari galeri');
      else toast(hasPhone ? 'Gambar diunduh & WhatsApp pelanggan dibuka — lampirkan gambar dari galeri' : 'Gambar nota tersimpan — bagikan manual lewat WhatsApp/galeri');
    }, 'image/png');
  }).catch(()=>{ toast('Gagal membuat gambar nota','⚠️'); });
}
function downloadNotaPdf(id){
  const o = orders.find(x=>x.id===id);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:[80, 150]});
  let y = 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(SETTINGS.businessName, 40, y, {align:'center'}); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text(SETTINGS.address, 40, y, {align:'center'}); y+=7;
  doc.setLineDashPattern([1,1],0); doc.line(5,y,75,y); y+=5;
  doc.setFontSize(9);
  doc.text('No. Nota: '+o.code, 5, y); y+=5;
  doc.text('Tanggal: '+fmtDateTime(o.createdAt), 5, y); y+=5;
  doc.text('Pelanggan: '+o.customer, 5, y); y+=5;
  doc.text('Layanan: '+o.serviceName, 5, y); y+=5;
  doc.text('Berat: '+o.weightKg+' kg x '+rupiah(o.pricePerKg), 5, y); y+=7;
  doc.line(5,y,75,y); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('TOTAL: '+rupiah(o.total), 5, y); y+=7;
  doc.setFontSize(9); doc.text(o.paid?'LUNAS':'BELUM LUNAS', 5, y); y+=7;
  if(o.sortNote){
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text('Rincian Sortir:', 5, y); y+=4;
    doc.setFont('helvetica','normal');
    const lines = doc.splitTextToSize(o.sortNote, 70);
    lines.forEach(l=>{ doc.text(l, 5, y); y+=4; });
    y+=3;
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  const footerLines = doc.splitTextToSize(SETTINGS.notaFooterText||'Terima kasih atas kepercayaan Anda', 70);
  footerLines.forEach(l=>{ doc.text(l, 40, y, {align:'center'}); y+=4; });
  doc.save('Nota-'+o.code+'.pdf');
  toast('Nota diunduh');
}

function saveServiceGroup(oldGroupName){
  const name = document.getElementById('sg-name').value.trim();
  if(!name){ toast('Nama layanan wajib diisi','⚠️'); return; }
  const unitType = document.getElementById('sg-unit').value;
  const note = document.getElementById('sg-note').value.trim();
  const checks = [...document.querySelectorAll('.sg-tier-check')];
  const activeTiers = checks.filter(c=>c.checked).map(c=>{
    const key = c.dataset.key;
    const preset = TIER_PRESETS.find(t=>t.key===key);
    const hours = +document.querySelector(`.sg-tier-hours[data-key="${key}"]`).value || preset.hours;
    const price = +document.querySelector(`.sg-tier-price[data-key="${key}"]`).value || 0;
    return {tierKey:key, tierLabel:preset.label, price, durationDays: hours/24};
  });
  if(!activeTiers.length){ toast('Pilih minimal satu kecepatan & isi harganya','⚠️'); return; }
  if(activeTiers.some(t=>t.price<=0)){ toast('Harga tiap kecepatan yang dicentang wajib diisi','⚠️'); return; }
  snapshot();
  if(oldGroupName) services = services.filter(s=>(s.groupName||s.name)!==oldGroupName);
  activeTiers.forEach(t=>{
    services.push({id:uid('svc_'), name, groupName:name, tierKey:t.tierKey, tierLabel:t.tierLabel, note, price:t.price, durationDays:t.durationDays, unitType});
  });
  DB.set('services', services); closeModal(); toast('Layanan tersimpan'); refreshServiceView();
}
function deleteServiceGroup(groupName){
  const remaining = services.filter(s=>(s.groupName||s.name)!==groupName);

  if(!confirm('Hapus layanan "'+groupName+'" beserta semua pilihan kecepatannya?')) return;
  snapshot();
  services = remaining; DB.set('services', services); refreshServiceView();
}

function restoreBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Memulihkan cadangan akan MENIMPA seluruh data saat ini di perangkat ini. Lanjutkan?')) return;
      if(data.settings) DB.set('settings', data.settings);
      if(data.orders) DB.set('orders', data.orders);
      if(data.kasirLog) DB.set('kasirLog', data.kasirLog);
      if(data.inventory) DB.set('inventory', data.inventory);
      if(data.invTx) DB.set('invTx', data.invTx);
      if(data.repairs) DB.set('repairs', data.repairs);
      if(data.kas) DB.set('kas', data.kas);
      if(data.services) DB.set('services', data.services);
      if(data.customers) DB.set('customers', data.customers);
      if(data.kosList) DB.set('kosList', data.kosList);
      if(data.pickupRequests) DB.set('pickupRequests', data.pickupRequests);
      if(data.theme) DB.set('theme', data.theme);
      if(data.bizId) DB.set('bizId', data.bizId);
      toast('Data dipulihkan, memuat ulang...');
      setTimeout(()=>location.reload(), 900);
    }catch(err){ toast('File cadangan tidak valid','⚠️'); }
  };
  reader.readAsText(file);
}

  const rows = kas.map(k=>({Tanggal:k.date, Jenis:k.type==='in'?'Masuk':'Keluar', Kategori:k.category, Keterangan:k.desc, Jumlah:k.amount}));
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kas');
  XLSX.writeFile(wb, 'Data-Kas-Laundry.xlsx'); toast('Excel diunduh');
}
function exportCustomersExcel(){
  const rows = customers.map(c=>{ const info = customerUnpaidInfo(c.phone); const kos = c.kosId?kosList.find(k=>k.id===c.kosId):null; return {Nama:c.name, HP:c.phone, Kos:kos?kos.name:'-', Langganan:c.subscriber?'Ya':'Tidak', TanggalGabung:c.joinDate, TotalTagihanBelumLunas:info.total||0, JumlahPesanan:customerOrders(c.phone).length, Catatan:c.notes||''}; });
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pelanggan');
  XLSX.writeFile(wb, 'Data-Pelanggan-Laundry.xlsx'); toast('Excel diunduh');
}
function exportServicesExcel(){
  const rows = services.map(s=>({Nama:s.groupName?s.groupName+' — '+s.tierLabel:s.name, Keterangan:s.note||'', Satuan:s.unitType==='pcs'?'Per Item':'Per Kg', Harga:s.price, EstimasiSelesai:fmtDuration(svcDurationDays(s))}));
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Layanan');
  XLSX.writeFile(wb, 'Data-Layanan-Laundry.xlsx'); toast('Excel diunduh');
}
function exportAllExcel(){
  const wb = XLSX.utils.book_new();
  const orderRows = orders.map(o=>({Kode:o.code, Tanggal:fmtDateTime(o.createdAt), Pelanggan:o.customer, HP:o.phone, Layanan:orderItems(o).map(it=>it.serviceName+' ('+it.qty+(it.unit==='pcs'?' pcs':' kg')+')').join(', '), Subtotal:o.subtotal!=null?o.subtotal:o.total, Diskon:o.discountAmount||0, Total:o.total, Status:STATUSES.find(s=>s.k===o.status).l, Lunas:o.paid?'Ya':'Belum', MetodeBayar:o.paid?(PAYMENT_METHODS.find(p=>p.k===o.paymentMethod)||{}).l||'-':'-'}));
  const custRows = customers.map(c=>({Nama:c.name, HP:c.phone, Langganan:c.subscriber?'Ya':'Tidak', TanggalGabung:c.joinDate}));
  const svcRows = services.map(s=>({Nama:s.groupName?s.groupName+' — '+s.tierLabel:s.name, Keterangan:s.note||'', Satuan:s.unitType==='pcs'?'Per Item':'Per Kg', Harga:s.price, EstimasiSelesai:fmtDuration(svcDurationDays(s))}));
  const kasRows = kas.map(k=>({Tanggal:k.date, Jenis:k.type==='in'?'Masuk':'Keluar', Kategori:k.category, Keterangan:k.desc, Jumlah:k.amount}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orderRows), 'Pesanan');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custRows), 'Pelanggan');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(svcRows), 'Layanan');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(kasRows), 'Kas');
  XLSX.writeFile(wb, 'Semua-Laporan-Laundry-'+todayStr()+'.xlsx');
  toast('Semua laporan diunduh dalam 1 file Excel');
}
